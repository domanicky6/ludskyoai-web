<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hraj sa a uč sa – Ľudsky o AI</title>
<meta name="description" content="Krátke hry o umelej inteligencii pre deti, rodičov aj seniorov. Ako sa AI učí, čo jej neprezrádzať a ako spoznať podvod. Bez registrácie, po slovensky.">
<meta property="og:title" content="Hraj sa a uč sa – Ľudsky o AI">
<meta property="og:description" content="Hry o AI pre celú rodinu: nauč Ľudka, uhádni slovo ako AI, odhaľ podvod. Bez registrácie.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ludskyoai.sk/hry.html">
<meta name="theme-color" content="#17153B">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
:root{--ink:#17153B;--ink2:#36335E;--mut:#4A4775;--bg:#F6F5FB;--lil:#A29BFE;--lil2:#EEECFF;--red:#FF5F57;--red2:#FFD6D3;--yel:#FEBC2E;--yel2:#FFF3CF;--grn:#28C840;--grn2:#C9F2D2;--sh:6px 6px 0 var(--ink)}
html{font-size:100%;-webkit-text-size-adjust:100%}
html.big{font-size:118%}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
a{color:var(--ink)}
button{font-family:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.wrap{max-width:1180px;margin:0 auto;padding:0 1.5rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--yel);outline-offset:3px}

/* ---------- tlačidlá ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.5rem;padding:0 1.6rem;border:3px solid var(--ink);border-radius:999px;background:#fff;font-weight:900;font-size:1.1rem;cursor:pointer;box-shadow:5px 5px 0 var(--ink);transition:transform .12s ease,box-shadow .12s ease;text-decoration:none;color:var(--ink)}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.btn.yel{background:var(--yel)}.btn.dark{background:var(--ink);color:#fff;box-shadow:5px 5px 0 var(--lil)}.btn.lil{background:var(--lil)}
.btn.sm{min-height:2.9rem;font-size:.95rem;padding:0 1.1rem;box-shadow:3px 3px 0 var(--ink)}
.btn[disabled]{opacity:.5;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:.4rem;height:2.75rem;padding:0 .9rem;border-radius:999px;font-weight:800;font-size:1rem;white-space:nowrap}
.tog{min-width:2.75rem;height:2.75rem;padding:0 .75rem;border:2px solid #fff;border-radius:999px;background:transparent;color:#fff;font-weight:800;font-size:.95rem;cursor:pointer;display:inline-flex;align-items:center;gap:.35rem;transition:background .15s}
.tog[aria-pressed="true"]{background:var(--yel);color:var(--ink);border-color:var(--yel)}
.tog .lbl{display:none}
@media (min-width:760px){.tog .lbl{display:inline}}

/* ---------- hlavička ---------- */
header.top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:40}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding-top:.6rem;padding-bottom:.6rem}
.logo{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:#fff;font-weight:800;font-size:1.15rem}
.dots3{display:flex;gap:6px}.dots3 i{width:12px;height:12px;border-radius:50%;display:block}
.tools{display:flex;align-items:center;gap:.45rem}
.starpill{background:#2C2960;color:#fff}
.starpill b{color:var(--yel);font-size:1.2rem}
.starpill.bump{animation:bump .5s ease}
@media (max-width:420px){.logo span.t{display:none}}

/* ---------- animácie ---------- */
@keyframes popIn{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:none;opacity:1}}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(4px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes jump{0%,100%{transform:translateY(0)}30%{transform:translateY(-22px) rotate(-4deg)}60%{transform:translateY(0) scale(1.05,.95)}}
@keyframes wave{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(16deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.25)}}
@keyframes starIn{0%{transform:scale(0) rotate(-60deg);opacity:0}70%{transform:scale(1.3) rotate(10deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(254,188,46,.75)}50%{box-shadow:0 0 0 12px rgba(254,188,46,0)}}
@keyframes floatUp{0%{transform:translateY(8px) scale(.7);opacity:0}25%{opacity:1;transform:translateY(0) scale(1.2)}100%{transform:translateY(-44px);opacity:0}}
@keyframes stampIn{0%{transform:scale(2.4) rotate(-14deg);opacity:0}60%{transform:scale(.92) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-8deg);opacity:1}}
@keyframes caret{50%{opacity:0}}
@keyframes think{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-6px);opacity:1}}
@keyframes hintLR{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(6px,-10px) rotate(8deg)}}
@keyframes dash{to{stroke-dashoffset:-40}}
.pop{animation:popIn .45s cubic-bezier(.2,.9,.3,1.3) both}
.slide{animation:slideUp .4s ease-out both}
.shake{animation:shake .45s ease both}
.bob{animation:bob 3s ease-in-out infinite}
.jump{animation:jump .7s ease both}
.glow{animation:glow 1.6s ease-in-out infinite}

/* ---------- Ľudko ---------- */
.ludko{overflow:visible;display:block}
.ludko .arm{transform-box:fill-box;transform-origin:0% 100%;animation:wave 1.5s ease-in-out infinite}
.ludko .eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.2s infinite}
.ludko .pupil{transition:transform .12s ease-out}
.ludko .badge{transform-box:fill-box;transform-origin:50% 50%;animation:popIn .45s cubic-bezier(.2,.9,.3,1.4) both}

/* ---------- rozcestník ---------- */
.hero{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.hero .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:2rem;padding-top:2.6rem;padding-bottom:3.2rem;position:relative;z-index:1}
.hero h1{margin:0;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.02;font-weight:900}
.hero p{margin:0;font-size:1.15rem;line-height:1.55;color:#D6D4EA;max-width:36rem}
.kicker{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:.85rem;letter-spacing:.08em;color:var(--yel)}
.prog{height:14px;background:#2C2960;border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--yel);border-radius:999px;transition:width .8s cubic-bezier(.2,.9,.3,1)}
.hero-ludko{flex:1 1 220px;display:flex;justify-content:center}
.sparkle{position:absolute;color:var(--yel);opacity:.55;animation:drift 6s ease-in-out infinite;pointer-events:none;font-size:1.4rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .8rem;border-radius:999px;font-weight:700;font-size:.9rem;background:#2C2960;color:#fff;text-decoration:none;border:2px solid transparent}
.chip:hover{border-color:var(--yel)}
.sec{padding-top:2.8rem;padding-bottom:1rem}
.sec h2{margin:0 0 .4rem;font-size:clamp(1.5rem,3.5vw,2rem);font-weight:900;display:flex;align-items:center;gap:.7rem}
.sec h2 .sq{width:18px;height:18px;border-radius:6px;border:2px solid var(--ink);flex:none}
.sec .lead{margin:0 0 1.4rem;color:var(--ink2);font-size:1.05rem;line-height:1.5;max-width:44rem}

/* Ľudkova cesta */
.path{margin:0;padding:1.6rem 1rem 1.2rem;position:relative;background:#fff;border:3px solid var(--ink);border-radius:28px;box-shadow:8px 8px 0 var(--ink);overflow:hidden}
.path::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 85%,#C9F2D2 0 60px,transparent 61px),radial-gradient(circle at 92% 18%,#FFF3CF 0 70px,transparent 71px),radial-gradient(circle at 55% 110%,#EEECFF 0 90px,transparent 91px);pointer-events:none}
.stops{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;position:relative}
.path svg.road{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.path svg.road path{animation:dash 3s linear infinite}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.45rem;padding-top:2.2rem}
.stop:nth-of-type(even){margin-top:3.2rem}
.stop-btn{position:relative;width:7.6rem;height:7.6rem;border-radius:50%;border:4px solid var(--ink);background:var(--c);box-shadow:6px 6px 0 var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:3.4rem;transition:transform .18s cubic-bezier(.2,.9,.3,1.4),box-shadow .18s}
.stop-btn:hover{transform:translate(-3px,-3px) scale(1.06) rotate(-4deg);box-shadow:9px 9px 0 var(--ink)}
.stop-btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.stop-btn .num{position:absolute;top:-.4rem;left:-.4rem;width:2.3rem;height:2.3rem;border-radius:50%;background:var(--ink);color:#fff;font-weight:900;font-size:1.05rem;display:flex;align-items:center;justify-content:center;border:3px solid #fff}
.stop-btn .done{position:absolute;bottom:-.3rem;right:-.3rem;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--grn);border:3px solid var(--ink);font-size:1rem;display:flex;align-items:center;justify-content:center}
.stop strong{font-size:1.15rem;font-weight:900;line-height:1.2}
.stop .sub{font-size:.88rem;color:var(--mut);font-weight:600;line-height:1.35;max-width:13rem}
.stars{font-size:1.35rem;letter-spacing:2px;line-height:1}
.stars .on{color:#E8A400}.stars .off{color:#D6D4EA}
.stop.has-here{padding-top:4.2rem}
.here{position:absolute;top:0;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:.2rem;pointer-events:none;z-index:2}
.here .say{background:var(--yel);border:2px solid var(--ink);border-radius:12px 12px 12px 2px;padding:.2rem .55rem;font-weight:900;font-size:.8rem;white-space:nowrap;margin-bottom:1.6rem}
@media (max-width:820px){
  .path{padding:1.2rem}.stops{grid-template-columns:1fr}.path svg.road{display:none}
  .stop{flex-direction:row;text-align:left;padding:.6rem 0;gap:1rem;margin-top:0!important}
  .stop:nth-of-type(even){flex-direction:row-reverse;text-align:right}
  .stop:nth-of-type(even) .txt{align-items:flex-end}
  .stop .txt{display:flex;flex-direction:column;gap:.3rem;flex:1}
  .stop-btn{width:6.2rem;height:6.2rem;font-size:2.7rem;flex:none}
  .stop.has-here{padding-top:3.4rem}
  .here{top:.2rem;left:auto;right:0;transform:none}
  .stop:nth-of-type(even) .here{right:auto;left:0}
  .here .say{margin-bottom:1.6rem}
  .agetag{align-self:flex-start}
  .stop:nth-of-type(even) .agetag{align-self:flex-end}
  .hero-ludko svg{width:150px}
  .bars .brow{grid-template-columns:5.2rem minmax(0,1fr) 2.9rem;gap:.45rem}
  .choice{min-height:4.2rem;flex-direction:column;gap:.15rem;font-size:1.05rem}
  .choice .i{font-size:1.6rem}
}
@media (min-width:821px){.stop .txt{display:flex;flex-direction:column;align-items:center;gap:.45rem}}

/* karty hier */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1.3rem}
.gcard{text-align:left;padding:0;border:3px solid var(--ink);border-radius:24px;background:#fff;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;box-shadow:8px 8px 0 var(--ink);transition:transform .2s ease,box-shadow .2s ease}
.gcard:hover{transform:translate(-4px,-4px) rotate(-.5deg);box-shadow:12px 12px 0 var(--ink)}
.gcard .head{background:var(--c);padding:1.1rem 1.3rem;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--ink);width:100%}
.gcard .emo{font-size:2.8rem;line-height:1}
.tag{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:.75rem;background:var(--ink);color:#fff;border-radius:999px;padding:.35rem .7rem;white-space:nowrap}
.gcard .body{padding:1rem 1.3rem 1.3rem;display:flex;flex-direction:column;gap:.6rem;width:100%}
.gcard strong{font-size:1.4rem;font-weight:900}
.gcard .desc{font-size:.95rem;line-height:1.45;color:var(--ink2)}
.gcard .row{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.gcard .best{font-size:.85rem;font-weight:700;color:var(--mut)}
.gcard .cta{display:flex;justify-content:center;align-items:center;min-height:3rem;border-radius:14px;background:var(--ink);color:#fff;font-weight:800;font-size:1.05rem}

.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.9rem}
.bdg{display:flex;align-items:center;gap:.75rem}
.bdg .ico{flex:none;width:3.4rem;height:3.4rem;border-radius:50%;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:var(--lil2)}
.bdg.off .ico{filter:grayscale(1);opacity:.45}
.bdg .t{display:flex;flex-direction:column;gap:2px}
.bdg .t b{font-size:.95rem}.bdg .t span{font-size:.8rem;color:var(--mut);line-height:1.3}
.panel{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:1.5rem}

.parents{background:var(--yel2);border:3px solid var(--ink);border-radius:28px;padding:1.6rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.1rem}
.parents .tip{display:flex;gap:.8rem;align-items:flex-start;font-size:1rem;line-height:1.5}
.parents .tip .n{flex:none;width:2.4rem;height:2.4rem;border-radius:12px;background:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:1.25rem}

/* ---------- intro hry ---------- */
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:1.6rem;align-items:stretch}
@media (max-width:820px){.intro{grid-template-columns:1fr}}
.intro .art{background:var(--c);border:3px solid var(--ink);border-radius:28px;box-shadow:8px 8px 0 var(--ink);padding:1.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;position:relative;overflow:hidden;min-height:18rem}
.intro .art .big-emo{font-size:5.5rem;line-height:1;animation:bob 3s ease-in-out infinite}
.intro .info{display:flex;flex-direction:column;gap:1.1rem}
.intro h1{margin:0;font-size:clamp(2rem,5vw,3rem);font-weight:900;line-height:1.05}
.say-box{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:1rem 3.6rem 1rem 1.2rem;font-size:1.15rem;line-height:1.55;font-weight:600}
.say-box::before{content:"";position:absolute;left:-14px;top:22px;border:12px solid transparent;border-right-color:var(--ink);border-left:0}
.say-box::after{content:"";position:absolute;left:-9px;top:24px;border:10px solid transparent;border-right-color:#fff;border-left:0}
@media (max-width:820px){.say-box::before,.say-box::after{display:none}}
.spk{position:absolute;right:.6rem;top:.6rem;width:2.6rem;height:2.6rem;border-radius:50%;border:2px solid var(--ink);background:var(--lil2);cursor:pointer;font-size:1.15rem;display:flex;align-items:center;justify-content:center}
.spk:hover{background:var(--yel)}
.spk.on{background:var(--yel);animation:bump .6s ease infinite}
.how{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6rem}
.how li{display:flex;gap:.8rem;align-items:center;font-size:1.05rem;line-height:1.4;font-weight:600}
.how li .n{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}
.learn{display:flex;gap:.7rem;align-items:center;background:var(--grn2);border:2px solid var(--ink);border-radius:16px;padding:.8rem 1rem;font-weight:700;line-height:1.4}
.switch{display:flex;align-items:center;gap:.8rem;cursor:pointer;font-weight:700;font-size:1rem;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .sw{flex:none;width:3.4rem;height:2rem;border-radius:999px;background:#D6D4EA;border:2px solid var(--ink);position:relative;transition:background .2s}
.switch .sw::after{content:"";position:absolute;top:2px;left:2px;width:1.5rem;height:1.5rem;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:transform .2s cubic-bezier(.2,.9,.3,1.4)}
.switch input:checked+.sw{background:var(--grn)}
.switch input:checked+.sw::after{transform:translateX(1.35rem)}
.switch input:focus-visible+.sw{outline:3px solid var(--yel);outline-offset:3px}

/* ---------- hra ---------- */
.play{max-width:960px;margin:0 auto;padding:1.4rem 1.2rem 5rem;display:flex;flex-direction:column;gap:1rem}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.7rem}
.hud{display:flex;align-items:center;gap:.5rem}
.pts{position:relative;background:var(--ink);color:#fff;font-weight:900;font-size:1.05rem}
.gain{position:absolute;right:.3rem;top:-.4rem;color:var(--grn);font-weight:900;font-size:1.25rem;text-shadow:0 2px 0 var(--ink);animation:floatUp 1.3s ease-out both;pointer-events:none}
.streak{background:var(--red);border:2px solid var(--ink)}
.ptitle{display:flex;align-items:center;gap:.8rem}
.ptitle .e{font-size:2.4rem}
.ptitle h1{margin:0;font-size:clamp(1.6rem,4.5vw,2.4rem);font-weight:900;line-height:1.05}
.pdots{display:flex;gap:.45rem}
.pdots i{flex:1;height:.8rem;border-radius:999px;border:2px solid var(--ink);background:#fff;transition:background .3s}
.pdots i.ok{background:var(--grn)}.pdots i.bad{background:var(--red)}.pdots i.cur{background:var(--yel);animation:bump .6s ease}
.stage{scroll-margin-top:5rem;position:relative;background:#fff;border:3px solid var(--ink);border-radius:28px;box-shadow:10px 10px 0 var(--ink);padding:1.6rem;display:flex;gap:1.5rem}
.side{flex:0 0 10.5rem;display:flex;flex-direction:column;align-items:center;gap:.7rem}
.bubble{position:relative;background:var(--bb,#EEECFF);border:2px solid var(--ink);border-radius:16px;padding:.6rem .8rem;font-weight:800;font-size:.98rem;line-height:1.3;text-align:center;min-height:2.6rem}
.bubble::before{content:"";position:absolute;top:-11px;left:50%;margin-left:-9px;border:9px solid transparent;border-bottom-color:var(--ink);border-top:0}
.bubble::after{content:"";position:absolute;top:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-bottom-color:var(--bb,#EEECFF);border-top:0}
.bubble .dots i{display:inline-block;width:.45rem;height:.45rem;border-radius:50%;background:var(--ink);margin:0 2px;animation:think 1s infinite}
.bubble .dots i:nth-child(2){animation-delay:.15s}.bubble .dots i:nth-child(3){animation-delay:.3s}
.content{flex:1;min-width:0;display:flex;flex-direction:column;gap:1.1rem}
@media (max-width:720px){
  .play{padding:1rem .9rem 4rem}
  .stage{flex-direction:column;padding:1rem;border-radius:22px;box-shadow:6px 6px 0 var(--ink);gap:1rem}
  .side{flex-direction:row;flex-basis:auto;align-items:center;gap:.6rem}
  .side .lk svg{width:84px!important}
  .bubble{flex:1;text-align:left}
  .bubble::before{top:50%;left:-11px;margin:-9px 0 0;border:9px solid transparent;border-right-color:var(--ink);border-left:0}
  .bubble::after{top:50%;left:-7px;margin:-7px 0 0;border:7px solid transparent;border-right-color:var(--bb,#EEECFF);border-left:0}
}
.timer{height:.8rem;background:var(--lil2);border-radius:999px;overflow:hidden;border:2px solid var(--ink)}
.timer i{display:block;height:100%;width:100%;background:var(--grn);border-radius:999px}

/* karta otázky */
.qcard{position:relative;background:var(--bg);border:3px solid var(--ink);border-radius:22px;padding:1.3rem 1.3rem 1.4rem;display:flex;flex-direction:column;gap:.8rem;touch-action:pan-y;user-select:none;transition:border-color .2s}
.qcard.swipe{cursor:grab}
.qcard.dragging{transition:none;cursor:grabbing}
.qcard .k{align-self:flex-start;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:.8rem;background:var(--ink);color:#fff;border-radius:999px;padding:.35rem .75rem}

    if (id === null || e.pointerId !== id) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    card.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + (dx / 25) + 'deg) scale(1.04)';
    var b = hit(e.clientX, e.clientY);
    if (b !== over) { if (over) over.classList.remove('over'); if (b) { b.classList.add('over'); sfx('tick'); } over = b; }
  });
  var up = function () {
    if (id === null) return; id = null; card.classList.remove('dragging');
    if (over) { var l = over.getAttribute('data-l'); over.classList.remove('over'); over = null; naucLabel(l, card); }
    else { card.style.transition = 'transform .35s cubic-bezier(.2,.9,.3,1.4)'; card.style.transform = ''; setTimeout(function () { card.style.transition = ''; }, 380); }
  };
  card.addEventListener('pointerup', up); card.addEventListener('pointercancel', up);
}
function naucLabel(l, fromCard) {
  if (R.busy) return; R.busy = true;
  var card = fromCard || $('#fcard'), basket = $('.basket[data-l="' + l + '"]');
  sfx('pop');
  var done = function () { R.labels.push(l); basket.classList.remove('pop'); void basket.offsetWidth; basket.classList.add('pop'); naucStep(); };
  if (reduce || !card || !card.animate) return done();
  var cr = card.getBoundingClientRect(), br = basket.getBoundingClientRect();
  var cur = getComputedStyle(card).transform; cur = cur === 'none' ? '' : cur;
  var dx = (br.left + br.width / 2) - (cr.left + cr.width / 2), dy = (br.top + br.height / 2) - (cr.top + cr.height / 2);
  var m = new DOMMatrix(cur || undefined);
  var anim = card.animate([{ transform: cur || 'none' }, { transform: 'translate(' + (m.e + dx) + 'px,' + (m.f + dy) + 'px) scale(.15) rotate(20deg)', opacity: 0.2 }], { duration: 380, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' });
  anim.onfinish = done;
}
function naucExam() {
  R.busy = true; R.keys = null;
  var c = $('#content'), lines = R.train.map(function (t, i) { return '<span style="animation-delay:' + (i * 0.12) + 's">' + esc(t.name) + ' → ' + R.labels[i] + '</span>'; }).join('');
  c.innerHTML = '<div class="brain"><span class="gear" aria-hidden="true">🧠</span><strong style="font-size:1.3rem">Ľudko sa učí z tvojich príkladov…</strong><div class="lines">' + lines + '</div></div>';
  setL('think', '…', '#EEECFF');
  autoSpeak('Ľudko sa učí z tvojich príkladov.');
  var items = R.test, res = [];
  wait(1900).then(function () {
    c.innerHTML = '<strong style="font-size:1.35rem">Skúška! Ľudko háda veci, ktoré ešte nevidel:</strong><div class="exam" id="exam"></div><div id="examEnd"></div>';
    setL('think', 'Hmm… to poznám?', '#EEECFF');
    var chain = Promise.resolve();
    items.forEach(function (t, i) {
      chain = chain.then(function () {
        var g = guess(t, R.train, R.labels), ok = g.label === t.ok; res.push(ok);
        $('#exam').insertAdjacentHTML('beforeend', '<div class="res" id="res' + i + '"><div class="top">' + food(t, 54) + '<strong>' + esc(t.name) + '</strong></div><span class="wait">Ľudko premýšľa…</span></div>');
        sfx('pop');
        return wait(850).then(function () {
          var el = $('#res' + i);
          el.classList.add(ok ? 'ok' : 'bad');
          el.innerHTML = '<div class="top">' + food(t, 54) + '<strong>' + esc(t.name) + '</strong></div>' +
            '<span class="g">Pripomína mu: <b>' + esc(g.like.join(', ')) + '</b></span><span class="g">Dal do košíka: <b>' + g.label + '</b></span>' +
            '<span class="v">' + (ok ? '✅ Správne!' : '❌ Chyba! Je to ' + t.ok.toLowerCase() + '.') + '</span>';
          if (ok) { sfx('ok'); setL('happy', pick(['Uhádol som!', 'Juchú!', 'Viem to!']), '#C9F2D2', 'jump'); confettiAt(el, 18); }
          else { sfx('bad'); setL('oops', 'Ups, popletil som sa!', '#FFD6D3', 'shake'); }
          return wait(650);
        });
      });
    });
    chain.then(function () {
      var cor = res.filter(Boolean).length, mistakes = R.labels.filter(function (l, i) { return l !== R.train[i].ok; }).length;
      R.correct = cor; R.points = cor * 100; hud(cor ? cor * 100 : 0);
      var lesson = mistakes > 0
        ? 'Ľudka si ' + mistakes + '× naučil zle – a on sa to tak naozaj naučil. AI je taká dobrá, aké dobré sú príklady.'
        : 'Ľudko porovnáva farbu, či je to sladké a či to rastie na strome. Nové veci zaradí podľa toho, čomu sa najviac podobajú. Presne takto sa z príkladov učí aj skutočná AI!';
      if (mistakes === 0 && cor < 4) lesson += ' Niekedy sa však pomýli aj tak – lebo videl len 6 príkladov. Skutočná AI potrebuje milióny.';
      $('#examEnd').innerHTML = '<div class="fb ' + (cor >= 3 ? 'ok' : 'bad') + '" style="margin-top:.9rem"><span class="t">Ľudko uhádol ' + cor + ' zo 4</span><span class="w">' + esc(lesson) + '</span></div>' +
        '<div class="nextrow" style="margin-top:.9rem"><button type="button" class="btn yel" id="nextBtn">Pozrieť hviezdičky ★</button></div>';
      var nb = $('#nextBtn'); nb.onclick = function () { finish(cor, 4, cor * 100); }; nb.focus({ preventScroll: true });
      try { nb.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' }); } catch (e) {}
      autoSpeak('Ľudko uhádol ' + cor + ' zo štyroch. ' + lesson);
      announce('Ľudko uhádol ' + cor + ' zo 4.');
    });
  });
}

/* =====================================================================
   SENIORI
   ===================================================================== */
function seniorRender() {
  var c = $('#content'), askedN = Object.keys(R.asked).length;
  $('#pdots').innerHTML = SENIOR.map(function (_, i) { return '<i class="' + (R.asked[i] ? 'ok' : '') + '"></i>'; }).join('');
  $('#pdots').setAttribute('aria-label', askedN + ' z 3 otázok');
  var q = R.q === null ? null : SENIOR[R.q];
  c.innerHTML = '<strong style="font-size:1.3rem">Ťuknite na otázku a pozrite sa, čo odpovie AI:</strong>' +
    SENIOR.map(function (x, i) { return '<button type="button" class="sqq' + (R.q === i ? ' cur' : '') + '" data-q="' + i + '"><span>' + esc(x.q) + '</span><span style="flex:none;font-size:1.4rem;color:#E8A400" aria-hidden="true">' + (R.asked[i] ? '★' : '›') + '</span></button>'; }).join('') +
    (q ? '<div class="chat"><div class="tb" aria-hidden="true"><i style="width:12px;height:12px;border-radius:50%;background:#FF5F57;display:block"></i><i style="width:12px;height:12px;border-radius:50%;background:#FEBC2E;display:block"></i><i style="width:12px;height:12px;border-radius:50%;background:#28C840;display:block"></i></div><div class="in"><div class="me">' + esc(q.q) + '</div><div class="ai" id="ai" aria-live="polite"></div><div id="tip"></div></div></div>' : '') +
    '<div class="tips3"><div style="background:#C9F2D2"><b>Pýtajte sa normálne,</b> ako by ste sa pýtali človeka.</div><div style="background:#FFF3CF"><b>Dôležité veci si overte</b> – zdravie, peniaze, úrady.</div><div style="background:#FFD6D3"><b>Nikdy nezadávajte</b> heslá, PIN ani čísla kariet.</div></div>' +
    '<span style="font-size:1.08rem;line-height:1.55;color:var(--ink2)">Vyskúšať môžete napríklad ChatGPT (chatgpt.com), Gemini (gemini.google.com) alebo Copilot (copilot.microsoft.com). Základné verzie sú zadarmo.</span>' +
    '<div id="sfin"></div>';
  $$('.sqq', c).forEach(function (b) { b.onclick = function () { seniorAsk(+b.getAttribute('data-q')); }; });
  if (!q) setL('hi', 'Opýtajte sa ma!', '#EEECFF');
  seniorFin(!q);
}
function seniorFin(show) {
  var n = Object.keys(R.asked).length, f = $('#sfin'); if (!f) return;
  f.innerHTML = show && n > 0 ? '<button type="button" class="btn yel pop" id="sDone">Hotovo – pozrieť hviezdičky ★</button>' : '';
  var d = $('#sDone'); if (d) d.onclick = function () { finish(n, SENIOR.length, n * 100); };
}
function seniorAsk(i) {
  if (R.iv) { clearInterval(R.iv); R.iv = 0; }
  stopSpeak(); sfx('click');
  R.q = i; R.asked[i] = true; R.points = Object.keys(R.asked).length * 100; hud(0);
  seniorRender();
  var full = SENIOR[i].a, ai = $('#ai'), k = 0;
  setL('think', 'Píšem odpoveď…', '#EEECFF');
  try { $('.chat').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' }); } catch (e) {}
  var done = function () {
    ai.innerHTML = esc(full);
    $('#tip').innerHTML = '<div class="pop" style="background:#FFF3CF;border-radius:16px;padding:1rem;font-size:1.15rem;line-height:1.5"><b>Ľudkov tip: </b>' + esc(SENIOR[i].tip) + spkBtnInline(full + ' ' + SENIOR[i].tip) + '</div>';
    setL('happy', Object.keys(R.asked).length < 3 ? 'Skúste ďalšiu otázku!' : 'Výborne, máte všetky!', '#C9F2D2', 'jump');
    sfx('ok'); seniorFin(true);
    autoSpeak(full);
  };
  if (reduce) return done();
  R.iv = setInterval(function () {
    if (!ai.isConnected) { clearInterval(R.iv); R.iv = 0; return; }
    k = Math.min(full.length, k + 2);
    ai.innerHTML = esc(full.slice(0, k)) + '<span class="caret"></span>'; if (k % 6 === 0) sfx('type');
    if (k >= full.length) { clearInterval(R.iv); R.iv = 0; done(); }
  }, 32);
}
function spkBtnInline(t) { return canSpeak ? ' <button type="button" class="btn sm" data-say="' + esc(t) + '" style="margin-top:.6rem;box-shadow:2px 2px 0 var(--ink)">🔊 Prečítať nahlas</button>' : ''; }

/* =====================================================================
   KONIEC KOLA
   ===================================================================== */
function finish(correct, total, points) {
  stopTimer(); R.keys = null; R.busy = true;
  var id = G.id, stars = correct === total ? 3 : (correct / total >= 0.6 ? 2 : (correct > 0 ? 1 : 0));
  var prevBest = save.best[id] || 0, prevStars = save.stars[id] || 0;
  save.best[id] = Math.max(prevBest, points); save.stars[id] = Math.max(prevStars, stars); store(STORE, save);
  var record = points > prevBest && prevBest > 0, badgeNew = stars === 3 && prevStars < 3;
  var gi = GAMES.indexOf(G), nx = GAMES[(gi + 1) % GAMES.length];
  if (G.aud === 'kids') { var kids = GAMES.filter(function (g) { return g.aud === 'kids'; }); var ki = kids.indexOf(G); nx = kids[ki + 1] || GAMES.filter(function (g) { return g.aud === 'trap'; })[0]; }
  var titles = ['Skús to ešte raz!', 'Dobrý začiatok!', 'Skvelá práca!', 'Perfektné!'];
  var sub = G.type === 'senior' ? 'Vyskúšali ste ' + correct + ' z ' + total + ' otázok' : (G.type === 'nauc' ? 'Ľudko uhádol ' + correct + ' zo ' + total : 'Správne ' + correct + ' z ' + total);
  $('#pdots').innerHTML = ''; $('#streak').hidden = true;
  var h = '<div class="end"><div class="bigstars" aria-label="' + stars + ' z 3 hviezdičiek"><span>★</span><span>★</span><span>★</span></div>' +
    '<span class="tt">' + titles[stars] + '</span><span style="font-size:1.1rem;color:var(--ink2)">' + sub + '</span>' +
    '<span class="score"><span id="cnt">0</span> b.</span>' +
    (record ? '<span class="flag pop glow" style="animation-delay:1.1s">🏆 Nový rekord!</span>' : '') +
    (badgeNew ? '<span class="newbadge pop" style="animation-delay:1.3s"><span class="ico glow" style="background:' + G.light + '" aria-hidden="true">' + G.badgeIco + '</span>Nový odznak: „' + esc(G.badge) + '“!</span>' : '') +
    '<div class="lesson slide" style="animation-delay:.8s"><b>💡 Zapamätaj si: </b>' + esc(G.lesson) + '</div>' +
    '<div class="talk slide" style="animation-delay:1s"><b>💬 POROZPRÁVAJTE SA</b>' + esc(G.talk) + '</div>' +
    '<div class="endbtns"><button type="button" class="btn yel" id="again">↻ Hrať znova</button>' +
    '<button type="button" class="btn" id="nextG">Ďalej: ' + nx.emoji + ' ' + esc(nx.title) + ' →</button>' +
    '<button type="button" class="btn lil" id="share">📣 Vyzvi kamaráta</button></div></div>';
  $('#content').innerHTML = h;
  setL('star', stars === 3 ? 'Si hviezda!' : (stars ? 'Ide ti to!' : 'Skúsime znova?'), '#FFF3CF', 'jump');
  // hviezdy postupne so zvukom
  $$('.bigstars span').forEach(function (s, i) {
    if (i < stars) setTimeout(function () { s.classList.add('on'); s.style.animationDelay = '0s'; sfx('star', i); if (i === stars - 1 && stars >= 2) { sfx('win'); confetti(stars === 3 ? 160 : 70); } }, reduce ? 0 : 350 + i * 330);
  });
  // počítadlo bodov
  var cnt = $('#cnt'), t0 = performance.now(), dur = reduce ? 1 : 900;
  (function up(now) { var f = Math.min(1, (now - t0) / dur); cnt.textContent = Math.round(points * (1 - Math.pow(1 - f, 3))); if (f < 1 && cnt.isConnected) requestAnimationFrame(up); })(t0);
  $('#again').onclick = function () { sfx('pop'); start(G); };
  $('#nextG').onclick = function () { sfx('click'); go(nx.id); };
  $('#share').onclick = function () {
    var txt = 'Získal(a) som ' + points + ' bodov v hre „' + G.title + '“ na Ľudsky o AI. Prekonáš ma?', url = location.href.split('#')[0] + '#' + G.id, b = this;
    try {
      if (navigator.share) { navigator.share({ text: txt, url: url }).catch(function () {}); return; }
      navigator.clipboard.writeText(txt + ' ' + url).then(function () { b.textContent = '✓ Skopírované – pošli to ďalej!'; }, function () {});
    } catch (e) {}
  };
  updStars(stars > prevStars);
  try { $('.stage').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); } catch (e) {}
  setTimeout(function () { var a = $('#again'); if (a) a.focus({ preventScroll: true }); }, 300);
  announce(titles[stars] + ' ' + sub + '. ' + points + ' bodov.');
  autoSpeak(titles[stars] + ' ' + sub + '. Zapamätaj si: ' + G.lesson);
