<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hraj sa a uč sa – Ľudsky o AI</title>
<meta name="description" content="Novinky o AI po slovensky – krátko, zrozumiteľne a vždy so zdrojom a dátumom. Rady, návody a hry pre deti, rodičov aj seniorov.">
<meta property="og:title" content="Hraj sa a uč sa – Ľudsky o AI">
<meta property="og:description" content="Umelá inteligencia, vysvetlená ľudsky. Novinky so zdrojom a dátumom, rady, návody a hry.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ludskyoai.sk/hry.html">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#F6F5FB}
a{color:#17153B}a:hover{color:#3A3770}
button{font-family:inherit}
.big{zoom:1.15;width:86.9565%!important}
.btn{transition:transform .12s ease, box-shadow .12s ease}
.btn:hover{transform:translate(-2px,-2px)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 #17153B!important}
.btn:focus-visible,.gcard:focus-visible{outline:3px solid #FEBC2E;outline-offset:3px}
.gcard{transition:transform .2s ease, box-shadow .2s ease}
.gcard:hover{transform:translate(-4px,-4px) rotate(-.5deg);box-shadow:12px 12px 0 #17153B!important}
@keyframes popIn{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
.pop{animation:popIn .45s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes popIn2{0%{transform:scale(.6) rotate(-6deg);opacity:0}70%{transform:scale(1.06) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.pop2{animation:popIn2 .45s cubic-bezier(.2,.9,.3,1.3) both}
.dragcard{cursor:grab;touch-action:manipulation}
.dragcard:active{cursor:grabbing}
.basket{transition:transform .15s ease, background .15s ease}
.basket:hover{transform:translateY(-3px)}
.basket:focus-visible{outline:3px solid #FEBC2E;outline-offset:3px}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.wiggle{animation:wiggle .5s ease-in-out}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.slide{animation:slideUp .4s ease-out both}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(4px)}}
.shake{animation:shake .45s ease both}
@keyframes floatUp{0%{transform:translateY(10px) scale(.8);opacity:0}25%{opacity:1;transform:translateY(0) scale(1.15)}100%{transform:translateY(-46px) scale(1);opacity:0}}
.plus{animation:floatUp 1.3s ease-out both}
@keyframes fall{0%{transform:translateY(-30px) rotate(0);opacity:1}100%{transform:translateY(520px) rotate(540deg);opacity:0}}
.confetti{position:absolute;top:0;width:10px;height:16px;border-radius:3px;animation-name:fall;animation-timing-function:cubic-bezier(.25,.6,.5,1);animation-fill-mode:both;pointer-events:none}
@keyframes timer{0%{width:100%;background:#28C840}60%{background:#FEBC2E}100%{width:0;background:#FF5F57}}
.tbar{height:100%;border-radius:999px;animation-name:timer;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes starIn{0%{transform:scale(0) rotate(-40deg);opacity:0}70%{transform:scale(1.25) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.star{display:inline-block;animation:starIn .5s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes ludkoWave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
.arm{transform-box:fill-box;transform-origin:0% 100%;animation:ludkoWave 1.4s ease-in-out infinite}
@keyframes blinkC{0%,100%{opacity:1}50%{opacity:0}}
.caret{animation:blinkC 1s step-end infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(254,188,46,.7)}50%{box-shadow:0 0 0 10px rgba(254,188,46,0)}}
.glow{animation:glow 1.6s ease-in-out infinite}
@media (max-width: 720px){
.sec{padding-top:28px!important;padding-bottom:40px!important}
.hide-m{display:none!important}
.stage{padding:18px!important;border-radius:22px!important;box-shadow:6px 6px 0 #17153B!important}
.qtext{font-size:21px!important}
.ludko-side{flex-basis:100%!important;flex-direction:row!important;align-items:center!important}
.ludko-svg{width:96px!important}
.h1{font-size:34px!important}
}
@media (prefers-reduced-motion: reduce){.pop,.slide,.shake,.plus,.confetti,.tbar,.star,.bob,.arm,.caret,.glow{animation:none!important}.btn,.gcard{transition:none}.confetti{display:none}}
</style>
<style>[v-cloak]{display:none}</style>
</head>
<body>
<div id="app" v-cloak>
<div :class="rootClass" style="font-family: Montserrat, system-ui, sans-serif; color: #17153B; background: #F6F5FB; width: 100%; min-height: 100vh; box-sizing: border-box; overflow-x: clip">

<!-- Hlavička -->
<header style="background: #17153B; color: #FFFFFF">
<div style="max-width: 1180px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<a href="./" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #FFFFFF">
<span style="display: flex; gap: 6px" aria-hidden="true"><span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span></span>
<span style="font-weight: 800; font-size: 19px">Ľudsky o AI</span>
</a>
<div style="display: flex; align-items: center; gap: 10px">
<span aria-label="Získané hviezdičky" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; border-radius: 999px; background: #2C2960; font-weight: 800; font-size: 16px"><span style="color: #FEBC2E; font-size: 20px">★</span>{{totalStars}} / {{maxStars}}</span>
<button type="button" class="btn" @click="toggleBig" :aria-pressed="bigPressed" aria-label="Väčšie písmo" :style="`min-width: 44px; height: 44px; padding: 0 12px; border: 2px solid #FFFFFF; border-radius: 999px; background: ${bigBg}; color: ${bigFg}; font-weight: 800; font-size: 15px; cursor: pointer`">{{bigLabel}}</button>
</div>
</div>
</header>

<!-- ===== ROZCESTNÍK ===== -->
<template v-if="isHub">
<section style="background: #17153B; color: #FFFFFF">
<div class="sec" style="max-width: 1180px; margin: 0 auto; padding: 48px 24px 56px; display: flex; flex-wrap: wrap; align-items: center; gap: 32px">
<div style="flex: 999 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; letter-spacing: 0.08em; color: #FEBC2E">ARKÁDA ĽUDKA · BEZ REGISTRÁCIE</span>
<h1 class="h1" style="margin: 0; font-size: 56px; line-height: 1.02; font-weight: 900; color: #FFFFFF">Hraj sa a uč sa</h1>
<p style="margin: 0; font-size: 19px; line-height: 1.55; color: #D6D4EA; max-width: 560px">Zbieraj hviezdičky, prekonaj svoj rekord a odomkni všetkých 6 odznakov. Každé kolo má iné otázky.</p>
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 460px">
<div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 15px"><span>Tvoj postup</span><span>{{totalStars}} z {{maxStars}} ★</span></div>
<div style="height: 14px; background: #2C2960; border-radius: 999px; overflow: hidden"><div :style="`height: 100%; width: ${progressPct}; background: #FEBC2E; border-radius: 999px; transition: width .6s ease`"></div></div>
</div>
</div>
<div class="bob hide-m" style="flex: 1 1 220px; display: flex; justify-content: center">
<svg viewBox="0 0 300 250" width="230" aria-hidden="true" style="overflow: visible">
<path d="M76 168 Q48 176 46 214" stroke="#A29BFE" stroke-width="11" fill="none" stroke-linecap="round"></path>
<path class="arm" d="M226 156 Q252 128 246 86" stroke="#A29BFE" stroke-width="11" fill="none" stroke-linecap="round"></path>
<rect x="70" y="70" width="160" height="146" rx="30" fill="#A29BFE"></rect><rect x="70" y="108" width="160" height="108" rx="30" fill="#FFFFFF"></rect><rect x="70" y="108" width="160" height="40" fill="#FFFFFF"></rect>
<circle cx="97" cy="89" r="6.5" fill="#FF5F57"></circle><circle cx="117" cy="89" r="6.5" fill="#FEBC2E"></circle><circle cx="137" cy="89" r="6.5" fill="#28C840"></circle>
<ellipse cx="114" cy="174" rx="9" ry="4.5" fill="#FFB8B8"></ellipse><ellipse cx="186" cy="174" rx="9" ry="4.5" fill="#FFB8B8"></ellipse>
<ellipse cx="128" cy="152" rx="9.5" ry="12" fill="#17153B"></ellipse><circle cx="130" cy="147" r="3.4" fill="#FFFFFF"></circle>
<ellipse cx="172" cy="152" rx="9.5" ry="12" fill="#17153B"></ellipse><circle cx="174" cy="147" r="3.4" fill="#FFFFFF"></circle>
<path d="M136 176 Q150 190 164 176" stroke="#17153B" stroke-width="5" fill="none" stroke-linecap="round"></path>
<text x="262" y="62" text-anchor="middle" font-size="40" fill="#FEBC2E">★</text>
</svg>
</div>
</div>
</section>

<section>
<div class="sec" style="max-width: 1180px; margin: 0 auto; padding: 48px 24px 32px; display: flex; flex-direction: column; gap: 36px">
<template v-for="(g, $index) in groups">
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; display: inline-flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 900"><span :style="`width: 18px; height: 18px; border-radius: 6px; background: ${g.color}; border: 2px solid #17153B`"></span>{{g.name}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px">
<template v-for="(t, $index) in g.games">
<button type="button" class="gcard" @click="t.open" style="text-align: left; padding: 0; border: 3px solid #17153B; border-radius: 24px; background: #FFFFFF; color: #17153B; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; box-shadow: 8px 8px 0 #17153B">
<div :style="`background: ${g.color}; padding: 20px 22px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; border-bottom: 3px solid #17153B; width: 100%; box-sizing: border-box`">
<span style="font-size: 44px; line-height: 1; font-weight: 900; font-family: 'JetBrains Mono', monospace">{{t.glyph}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px; background: #17153B; color: #FFFFFF; border-radius: 999px; padding: 6px 10px">{{t.tag}}</span>
</div>
<div style="padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 10px; width: 100%; box-sizing: border-box">
<strong style="font-size: 23px; font-weight: 900">{{t.title}}</strong>
<span style="font-size: 15px; line-height: 1.45; color: #36335E">{{t.desc}}</span>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px">
<span :aria-label="t.starsLabel" style="font-size: 24px; letter-spacing: 2px"><span style="color: #E8A400">{{t.starsOn}}</span><span style="color: #D6D4EA">{{t.starsOff}}</span></span>
<span style="font-size: 14px; font-weight: 700; color: #4A4775">{{t.bestText}}</span>
</div>
<span style="margin-top: 4px; display: inline-flex; justify-content: center; align-items: center; min-height: 48px; border-radius: 14px; background: #17153B; color: #FFFFFF; font-weight: 800; font-size: 17px">{{t.cta}}</span>
</div>
</button>
</template>
</div>
</div>
</template>

<!-- Odznaky -->
<div style="background: #FFFFFF; border: 3px solid #17153B; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 22px; font-weight: 900">Tvoje odznaky</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px">
<template v-for="(b, $index) in badges">
<div :style="`display: flex; align-items: center; gap: 12px; opacity: ${b.opacity}`">
<span :class="b.cls" :style="`flex: none; width: 52px; height: 52px; border-radius: 50%; background: ${b.bg}; border: 3px solid #17153B; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 20px`">{{b.glyph}}</span>
<span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 15px">{{b.name}}</strong><span style="font-size: 13px; color: #4A4775">{{b.state}}</span></span>
</div>
</template>
</div>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #4A4775">Hry nič neodosielajú. Hviezdičky a rekordy sa ukladajú len v tvojom prehliadači. Ukážkové texty a správy sú vytvorené pre tieto hry.</p>
</div>
</section>
</template>

<!-- ===== HRA ===== -->
<template v-if="isPlay">
<section>
<div class="sec" style="max-width: 920px; margin: 0 auto; padding: 28px 24px 80px; display: flex; flex-direction: column; gap: 18px">

<!-- Horná lišta -->
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<button type="button" class="btn" @click="goHub" style="min-height: 44px; padding: 0 18px; border: 2px solid #17153B; border-radius: 999px; background: #FFFFFF; color: #17153B; font-weight: 700; font-size: 15px; cursor: pointer">← Všetky hry</button>
<div style="display: flex; align-items: center; gap: 10px">
<template v-if="hud.showStreak">
<span class="pop" style="height: 44px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; background: #FF5F57; border: 2px solid #17153B; font-weight: 900; font-size: 15px">Séria ×{{hud.streak}}</span>
</template>
<span style="position: relative; height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 16px; border-radius: 999px; background: #17153B; color: #FFFFFF; font-weight: 900; font-size: 17px">{{hud.points}} b.
<template v-if="hud.showGain"><span class="plus" style="position: absolute; right: 6px; top: -6px; color: #28C840; font-weight: 900; font-size: 20px; text-shadow: 0 2px 0 #17153B">+{{hud.gain}}</span></template>
</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.06em; color: #4A4775">{{cur.tag}}</span>
<h1 class="h1" style="margin: 0; font-size: 40px; font-weight: 900; line-height: 1.05">{{cur.title}}</h1>
</div>

<!-- Postup -->
<template v-if="hud.showDots">
<div style="display: flex; gap: 8px" :aria-label="hud.dotsLabel">
<template v-for="(d, $index) in hud.dots">
<span :style="`flex: 1; height: 12px; border-radius: 999px; background: ${d.bg}; border: 2px solid #17153B`"></span>
</template>
</div>
</template>

<!-- Javisko -->
<div class="stage" style="position: relative; overflow: hidden; background: #FFFFFF; border: 3px solid #17153B; border-radius: 28px; box-shadow: 10px 10px 0 #17153B; padding: 28px; display: flex; flex-wrap: wrap; gap: 24px">

<template v-if="fx.confetti">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
<template v-for="(c, $index) in fx.pieces">
<span class="confetti" :style="`left: ${c.left}; background: ${c.color}; animation-delay: ${c.delay}; animation-duration: ${c.dur}`"></span>
</template>
</div>
</template>

<!-- Ľudko -->
<div class="ludko-side" style="flex: 0 0 170px; display: flex; flex-direction: column; align-items: center; gap: 10px">
<svg :class="`ludko-svg ${ludko.cls}`" viewBox="40 30 260 200" width="160" aria-hidden="true" style="overflow: visible; flex: none">
<path d="M76 168 Q48 176 46 214" stroke="#A29BFE" stroke-width="11" fill="none" stroke-linecap="round"></path>
<path class="arm" d="M226 156 Q252 128 246 86" stroke="#A29BFE" stroke-width="11" fill="none" stroke-linecap="round"></path>
<rect x="70" y="70" width="160" height="146" rx="30" fill="#A29BFE"></rect><rect x="70" y="108" width="160" height="108" rx="30" fill="#FFFFFF"></rect><rect x="70" y="108" width="160" height="40" fill="#FFFFFF"></rect>
<circle cx="97" cy="89" r="6.5" fill="#FF5F57"></circle><circle cx="117" cy="89" r="6.5" fill="#FEBC2E"></circle><circle cx="137" cy="89" r="6.5" fill="#28C840"></circle>
<ellipse cx="114" cy="174" rx="9" ry="4.5" fill="#FFB8B8" :opacity="ludko.cheeks"></ellipse><ellipse cx="186" cy="174" rx="9" ry="4.5" fill="#FFB8B8" :opacity="ludko.cheeks"></ellipse>
<ellipse cx="128" cy="152" rx="9.5" ry="12" fill="#17153B"></ellipse><circle cx="130" cy="147" r="3.4" fill="#FFFFFF"></circle>
<ellipse cx="172" cy="152" rx="9.5" ry="12" fill="#17153B"></ellipse><circle cx="174" cy="147" r="3.4" fill="#FFFFFF"></circle>
<line x1="164" y1="131" x2="184" y2="126" stroke="#17153B" stroke-width="5" stroke-linecap="round" :opacity="ludko.brow"></line>
<path d="M136 176 Q150 190 164 176" stroke="#17153B" stroke-width="5" fill="none" stroke-linecap="round" :opacity="ludko.smile"></path>
<ellipse cx="150" cy="182" rx="6" ry="7" fill="#17153B" :opacity="ludko.o"></ellipse>
<line x1="139" y1="186" x2="160" y2="181" stroke="#17153B" stroke-width="5" stroke-linecap="round" :opacity="ludko.flat"></line>
<g :opacity="ludko.bOk"><circle cx="258" cy="60" r="22" fill="#28C840"></circle><path d="M247 60 l8 8 l14 -15" stroke="#17153B" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></g>
<g :opacity="ludko.bPozor"><circle cx="258" cy="60" r="22" fill="#FF5F57"></circle><line x1="258" y1="48" x2="258" y2="62" stroke="#17153B" stroke-width="6" stroke-linecap="round"></line><circle cx="258" cy="72" r="3.6" fill="#17153B"></circle></g>
<g :opacity="ludko.bHmm"><circle cx="258" cy="60" r="22" fill="#A29BFE"></circle><text x="258" y="70" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="28" font-weight="800" fill="#17153B">?</text></g>
<g :opacity="ludko.bStar"><text x="258" y="74" text-anchor="middle" font-size="46" fill="#FEBC2E" stroke="#17153B" stroke-width="2">★</text></g>
</svg>
<div class="pop" aria-live="polite" :style="`background: ${ludko.bubble}; border: 2px solid #17153B; border-radius: 16px; padding: 10px 14px; font-weight: 800; font-size: 15px; line-height: 1.3; text-align: center`">{{ludko.say}}</div>
</div>

<!-- Obsah hry -->
<div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 18px">

<template v-if="showTimer">
<div aria-hidden="true" style="height: 12px; background: #EEECFF; border-radius: 999px; overflow: hidden"><div class="tbar" :style="`animation-duration: ${timerDur}`"></div></div>
</template>

<!-- Binárne otázky -->
<template v-if="bin.on">
<div style="display: flex; flex-direction: column; gap: 18px">
<div :class="bin.cardCls" style="background: #F6F5FB; border: 3px solid #17153B; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<span style="align-self: flex-start; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; background: #17153B; color: #FFFFFF; border-radius: 999px; padding: 6px 12px">{{bin.kind}}</span>
<p class="qtext" style="margin: 0; font-size: 24px; line-height: 1.4; font-weight: 700; white-space: pre-line">{{bin.text}}</p>
</div>
<template v-if="asking">
<div style="display: flex; flex-wrap: wrap; gap: 14px">
<button type="button" class="btn" @click="bin.pickA" :style="`flex: 1 1 160px; min-height: 68px; border: 3px solid #17153B; border-radius: 18px; background: ${bin.colA}; color: #17153B; font-size: 21px; font-weight: 900; cursor: pointer; box-shadow: 5px 5px 0 #17153B`">{{bin.labelA}}</button>
<button type="button" class="btn" @click="bin.pickB" :style="`flex: 1 1 160px; min-height: 68px; border: 3px solid #17153B; border-radius: 18px; background: ${bin.colB}; color: #17153B; font-size: 21px; font-weight: 900; cursor: pointer; box-shadow: 5px 5px 0 #17153B`">{{bin.labelB}}</button>
</div>
</template>
</div>
</template>

<!-- Vyber vymyslenú vetu -->
<template v-if="pick.on">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; color: #4A4775">OTÁZKA PRE AI</span>
<strong class="qtext" style="font-size: 22px">„{{pick.q}}“</strong>
</div>
<span style="font-weight: 700; font-size: 16px; color: #36335E">Jedna veta v odpovedi nie je pravda. Ťukni na ňu:</span>
<template v-for="(s, $index) in pick.sentences">
<button type="button" :class="`btn ${s.cls}`" @click="s.choose" :style="`text-align: left; min-height: 56px; padding: 12px 18px; border: 3px solid #17153B; border-radius: 16px; background: ${s.bg}; color: #17153B; font-size: 18px; font-weight: 600; line-height: 1.4; cursor: pointer; box-shadow: ${s.shadow}`">{{s.text}}</button>
</template>
</div>
</template>

<!-- Nauč Ľudka -->
<template v-if="nc.train">

<template v-if="sn.on">

<template v-if="sn.has">

  vals.asking = false; vals.showTimer = false; vals.timerDur = '0s';
  vals.fx = { confetti: false, pieces: PIECES };
  vals.ludko = { smile: 1, o: 0, flat: 0, brow: 0, cheeks: 1, bOk: 0, bPozor: 0, bHmm: 0, bStar: 0, say: 'Ahoj!', bubble: '#EEECFF', cls: '' };
  if (!g || !r) return vals;

  var face = function (kind, say, bubble) {
    var f = { smile: 0, o: 0, flat: 0, brow: 0, cheeks: 0, bOk: 0, bPozor: 0, bHmm: 0, bStar: 0, say: say, bubble: bubble, cls: '' };
    if (kind === 'think') { f.flat = 1; f.brow = 1; f.bHmm = 1; }
    if (kind === 'happy') { f.smile = 1; f.cheeks = 1; f.bOk = 1; f.cls = 'pop'; }
    if (kind === 'oops') { f.o = 1; f.bPozor = 1; f.cls = 'shake'; }
    if (kind === 'star') { f.smile = 1; f.cheeks = 1; f.bStar = 1; f.cls = 'bob'; }
    if (kind === 'learn') { f.smile = 1; f.cheeks = 1; f.bHmm = 1; }
    return f;
  };

  vals.hud.points = r.points || 0;
  vals.hud.gain = r.gain || 0;
  vals.hud.showGain = s.phase === 'a' && r.gain > 0;
  vals.hud.streak = r.streak || 0;
  vals.hud.showStreak = (r.streak || 0) >= 2 && s.phase !== 'end';

  if (s.phase === 'end') {
    var res = s.result, stars = [0, 1, 2].map(function (i) { return { delay: (0.2 + i * 0.25) + 's', color: i < res.stars ? '#FEBC2E' : '#D6D4EA' }; });
    var gi = GAMES.indexOf(g), nx = GAMES[(gi + 1) % GAMES.length];
    var titles = ['Skús to ešte raz!', 'Dobrý začiatok!', 'Skvelá práca!', 'Perfektné!'];
    var lessons = {
      nauc: 'AI sa učí z príkladov. Keď sú príklady zlé, aj AI sa naučí zle.',
      prezradit: 'Ľudkovo pravidlo: AI povedz len to, čo by si pokojne povedal aj cudziemu človeku.',
      robot: 'Rozoznať text od AI je často veľmi ťažké. Preto je dôležité vedieť, odkiaľ text pochádza.',
      podvod: 'Znaky podvodu: naliehanie, peniaze, neznáme číslo a sľuby, ktoré sú príliš dobré. Ak ťa okradli, volaj políciu na 158.',
      halu: 'AI píše plynule aj vtedy, keď sa mýli. Dôležité fakty si over a pýtaj sa: „Z akého zdroja to máš?“',
      senior: 'Teraz už vieš, ako vyzerá rozhovor s AI. Skús si to naozaj – a dôležité veci si vždy over.'
    };
    vals.end = { on: true, stars: stars, starsLabel: res.stars + ' z 3 hviezdičiek', title: titles[res.stars], sub: g.type === 'senior' ? 'Vyskúšal si ' + res.correct + ' z ' + res.total + ' otázok' : (g.type === 'nauc' ? 'Ľudko uhádol ' + res.correct + ' z ' + res.total : 'Správne ' + res.correct + ' z ' + res.total),
      points: res.points, record: res.record, badgeNew: res.badgeNew, badgeName: '„' + BADGES[g.id] + '“', badgeGlyph: g.glyph, badgeBg: GROUPS[g.group].color,
      lesson: lessons[g.id], again: function () { self.start(g.id); }, nextGame: function () { self.start(nx.id); }, nextTitle: nx.title,
      shareLabel: s.shared || 'Vyzvi kamaráta',
      share: function () { self.share('Získal som ' + res.points + ' bodov v hre „' + g.title + '“ na Ľudsky o AI. Prekonáš ma?'); } };
    vals.ludko = face('star', res.stars === 3 ? 'Si hviezda!' : 'Ide ti to!', '#FFF3CF');
    vals.fx.confetti = res.stars >= 2;
    return vals;
  }

  if (g.type === 'bin' || g.type === 'pick') {
    var pool = POOLS[g.id], item = pool[r.items[r.i]];
    vals.hud.showDots = true; vals.hud.dotsLabel = 'Otázka ' + (r.i + 1) + ' z ' + r.items.length;
    vals.hud.dots = r.items.map(function (_, i) { return { bg: i < r.i ? '#28C840' : (i === r.i ? '#FEBC2E' : '#FFFFFF') }; });
    vals.asking = s.phase === 'q';
    vals.showTimer = !!g.timer && s.phase === 'q'; vals.timerDur = g.timer + 's';
    if (g.type === 'bin') {
      vals.bin = { on: true, kind: item.kind, text: item.text, labelA: g.labels[0], labelB: g.labels[1], colA: g.cols[0], colB: g.cols[1],
        cardCls: s.phase === 'a' ? (r.ok ? 'pop' : 'shake') : 'slide',
        pickA: function () { self.answer(true); }, pickB: function () { self.answer(false); } };
    } else {
      vals.pick = { on: true, q: item.q, sentences: item.s.map(function (t, i) {
        var ans = s.phase === 'a', isW = i === item.wrong, picked = i === r.pick;
        return { text: t, bg: ans && isW ? '#FFD6D3' : (ans && picked ? '#EEECFF' : '#FFFFFF'), shadow: ans && isW ? '5px 5px 0 #FF5F57' : '4px 4px 0 #17153B',
          cls: ans && isW ? (r.ok ? 'pop' : 'shake') : '', choose: function () { self.answer(i); } };
      }) };
    }
    if (s.phase === 'q') vals.ludko = face('think', g.type === 'pick' ? 'Hmm… kde je chyba?' : (r.streak >= 2 ? 'Séria! Pokračuj!' : 'Čo myslíš?'), '#EEECFF');
    else {
      vals.ludko = r.ok ? face('happy', CHEERS[(r.i + r.streak) % CHEERS.length], '#C9F2D2') : face('oops', OOPS[r.i % OOPS.length], '#FFD6D3');
      vals.fx.confetti = r.ok;
      var title;
      if (g.id === 'podvod') title = (r.ok ? 'Správne! ' : 'Pozor! ') + (item.a ? 'Je to podvod.' : 'Toto je v poriadku.');
      else if (g.id === 'robot') title = (r.ok ? 'Správne! ' : 'Nie celkom. ') + (item.a ? 'Napísal to človek.' : 'Napísala to AI.');
      else if (g.id === 'prezradit') title = (r.ok ? 'Správne! ' : 'Hmm, zamysli sa. ') + (item.a ? 'Toto môžeš povedať.' : 'Toto si nechaj pre seba.');
      else title = r.ok ? 'Našiel si ju!' : 'Táto veta bola pravdivá. Vymyslená je tá červená.';
      vals.fb = { on: true, bg: r.ok ? '#C9F2D2' : '#FFD6D3', title: title + (r.ok ? '  +' + r.gain + ' b.' : ''), why: item.why,
        hasSigns: !!item.signs, signs: item.signs || '', hasSrc: !!item.src, src: item.src || '',
        nextLabel: r.i + 1 < r.items.length ? 'Ďalej →' : 'Výsledok →', next: function () { self.next(); } };
    }
    return vals;
  }

  if (g.type === 'nauc') {
    var total = r.train.length, n = r.labels.length;
    vals.hud.showDots = true; vals.hud.dotsLabel = 'Príklad ' + Math.min(n + 1, total) + ' z ' + total;
    vals.hud.dots = r.train.map(function (_, i) { return { bg: i < n ? '#28C840' : (i === n ? '#FEBC2E' : '#FFFFFF') }; });
    if (s.phase === 'q') {
      var it = r.train[n], over = s.over || null;
      var inO = [], inZ = [];
      r.labels.forEach(function (l, i) { (l === 'Ovocie' ? inO : inZ).push(r.train[i].name); });
      var drop = function (l) { return function (e) { try { e.preventDefault(); } catch (x) {} self.setState({ over: null }); self.nauLabel(l); }; };
      var dragOver = function (l) { return function (e) { try { e.preventDefault(); } catch (x) {} if (self.state.over !== l) self.setState({ over: l }); }; };
      vals.nc = { train: true, exam: false, name: it.name, p: pic(it), cardCls: n % 2 ? 'pop2' : 'pop',
        hint: n === 0 ? 'Potiahni obrázok do správneho košíka (alebo ťukni na košík)' : 'Ďalší! Ešte ' + (total - n) + (total - n === 1 ? ' príklad' : (total - n < 5 ? ' príklady' : ' príkladov')),
        inO: inO, inZ: inZ,
        bgO: over === 'Ovocie' ? '#FFB3AE' : '#FFD6D3', bgZ: over === 'Zelenina' ? '#9BE5AB' : '#C9F2D2',
        borderO: over === 'Ovocie' ? 'dashed' : 'solid', borderZ: over === 'Zelenina' ? 'dashed' : 'solid',
        dragStart: function (e) { try { e.dataTransfer.setData('text/plain', it.name); e.dataTransfer.effectAllowed = 'move'; } catch (x) {} },
        overO: dragOver('Ovocie'), overZ: dragOver('Zelenina'), leave: function () { self.setState({ over: null }); },
        dropO: drop('Ovocie'), dropZ: drop('Zelenina'),
        ovocie: function () { self.nauLabel('Ovocie'); }, zelenina: function () { self.nauLabel('Zelenina'); } };
      vals.ludko = face('learn', n === 0 ? 'Nauč ma to!' : (n < 3 ? 'Aha, zapamätám si!' : 'Už to skoro viem!'), '#EEECFF');
    } else {
      var mistakes = r.labels.filter(function (l, i) { return l !== r.train[i].ok; }).length;
      var results = r.test.map(function (t, i) { var gu = guess(t, r.train, r.labels), ok = gu === t.ok;
        return { name: t.name, p: pic(t), guess: gu, verdict: ok ? 'Správne!' : 'Chyba! Je to ' + t.ok.toLowerCase() + '.', bg: ok ? '#C9F2D2' : '#FFD6D3', delay: (0.15 + i * 0.35) + 's' }; });
      vals.nc = { train: false, exam: true, results: results,
        lesson: mistakes > 0 ? 'Ľudka si ' + mistakes + '× naučil zle – a on sa to tak naozaj naučil. AI je taká dobrá, aké dobré sú príklady.' : 'Ľudko porovnáva farbu, sladkosť a či to rastie na strome. Takto sa z príkladov učí aj skutočná AI.',
        finish: function () { self.finish(r.correct, r.test.length, r.points); } };
      vals.ludko = r.ok ? face('happy', 'Naučil si ma dobre!', '#C9F2D2') : face('oops', 'Ups, popletil som sa!', '#FFD6D3');
      vals.fx.confetti = r.correct === 4;
    }
    return vals;
  }

  if (g.type === 'senior') {
    var sq = r.q === null ? null : SENIOR[r.q], askedN = Object.keys(r.asked).length;
    vals.sn = { on: true, has: !!sq, q: sq ? sq.q : '', typed: sq ? sq.a.slice(0, r.chars) : '', typing: !!sq && r.chars < sq.a.length, done: !!sq && r.chars >= sq.a.length, tip: sq ? sq.tip : '',
      canFinish: askedN > 0 && (!sq || r.chars >= sq.a.length),
      finish: function () { self.finish(askedN, SENIOR.length, askedN * 100); },
      questions: SENIOR.map(function (x, i) { return { text: x.q, bg: r.q === i ? '#FEBC2E' : '#FFFFFF', mark: r.asked[i] ? '★' : '', ask: function () { self.ask(i); } }; }) };
    vals.hud.showDots = true; vals.hud.dotsLabel = askedN + ' z 3 otázok';
    vals.hud.dots = SENIOR.map(function (_, i) { return { bg: r.asked[i] ? '#28C840' : '#FFFFFF' }; });
    vals.ludko = sq ? (r.chars < sq.a.length ? face('think', 'Píšem odpoveď…', '#EEECFF') : face('happy', 'Skús ďalšiu otázku!', '#C9F2D2')) : face('learn', 'Opýtaj sa ma!', '#EEECFF');
    return vals;
  }
  return vals;
}
}
mountPage(Component);
</script>
</body>
</html>
